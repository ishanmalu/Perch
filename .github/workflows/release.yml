name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Imported before the build so Scripts/build-app.sh finds the identity
      # in the keychain and signs with it instead of falling back to ad-hoc.
      # A stable identity is what stops macOS dropping the Accessibility grant
      # on every update.
      - name: Import signing certificate
        id: signing
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # A self-signed certificate chains to nothing, so `find-identity -v`
          # -- which lists only trusted identities -- reports none and the build
          # silently falls back to ad-hoc. Trusting it in this throwaway
          # keychain is what makes it usable for signing.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -legacy \
            -passin pass:"$MACOS_CERTIFICATE_PWD" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys \
                 -passin pass:"$MACOS_CERTIFICATE_PWD" -out "$RUNNER_TEMP/cert.pem"
          security add-trusted-cert -r trustRoot -p codeSign \
            -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem" || \
            echo "note: could not add trust settings; relying on the identity alone"

          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          echo "identities in the build keychain:"
          security find-identity -p codesigning "$KEYCHAIN"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          PERCH_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: Scripts/make-dmg.sh "${{ steps.version.outputs.value }}"

      # Only runs with an Apple Developer account behind it. Without the Apple
      # ID secrets the release still ships, signed but not notarized.
      - name: Notarize and staple
        if: ${{ steps.signing.outputs.enabled == 'true' && env.APPLE_ID != '' }}
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: Scripts/notarize.sh dist/Perch.app "${{ steps.version.outputs.value }}"

      - name: Report signing identity
        run: |
          echo "Shipped signature:"
          codesign -dv --verbose=2 dist/Perch.app 2>&1 | grep -E "Authority|Signature|Identifier" || true

      - name: Self-test the shipped binary
        run: dist/Perch.app/Contents/MacOS/Perch --selftest
      - name: Checksum
        # After stapling — the ticket is written into the DMG, changing its hash.
        run: shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS.txt
      - name: Validate the cask renders
        run: |
          SHA=$(awk '{print $1}' dist/SHA256SUMS.txt | head -1)
          sed -e "s/__VERSION__/${{ steps.version.outputs.value }}/g" \
              -e "s/__SHA256__/$SHA/g" homebrew/perch.rb > /tmp/perch.rb
          grep -q "__" /tmp/perch.rb && { echo "unsubstituted placeholder"; exit 1; }
          cat /tmp/perch.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          body: |
            ### Install

            1. Download `Perch-${{ steps.version.outputs.value }}.dmg` below.
            2. Open it and drag **Perch** to **Applications**.
            3. Clear the download flag, then open Perch:

               ```
               xattr -dr com.apple.quarantine /Applications/Perch.app
               ```

            Perch is signed but not notarized (that needs a paid Apple Developer
            account), so macOS blocks it until the flag is cleared. Without a
            terminal: open Perch, dismiss the warning, then System Settings →
            Privacy & Security → **Open Anyway**.

            On macOS 15 and later, Control-click → Open no longer works for
            unnotarized apps.

            ### Then

            Grant Accessibility access in System Settings → Privacy & Security →
            Accessibility for window management, the switcher, and cleaning modes.
            Press **⌃⌥Space** to open the panel.

            ### Verify the download

            ```
            shasum -a 256 -c SHA256SUMS.txt
            ```

            Full instructions: https://github.com/ishanmalu/perch#install

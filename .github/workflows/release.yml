name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build DMG
        run: Scripts/make-dmg.sh "${{ steps.version.outputs.value }}"
      - name: Self-test the shipped binary
        run: dist/Perch.app/Contents/MacOS/Perch --selftest
      - name: Checksum
        run: shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS.txt
      - name: Validate the cask renders
        run: |
          SHA=$(awk '{print $1}' dist/SHA256SUMS.txt | head -1)
          sed -e "s/__VERSION__/${{ steps.version.outputs.value }}/g" \
              -e "s/__SHA256__/$SHA/g" homebrew/perch.rb > /tmp/perch.rb
          grep -q "__" /tmp/perch.rb && { echo "unsubstituted placeholder"; exit 1; }
          cat /tmp/perch.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          body: |
            Download the DMG, drag Perch to Applications, then right-click → Open
            on first launch (the build is ad-hoc signed, not notarized).

            Verify the download against `SHA256SUMS.txt`.
